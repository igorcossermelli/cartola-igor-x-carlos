name: Atualizar site

on:
  schedule:
    # a cada 3 horas; o build so publica algo quando os dados mudam
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/atualizar.yml'

permissions:
  contents: write

concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install pillow==11.3.0

      - name: Montar o site
        run: python build/montar.py

      - name: Publicar se mudou
        run: |
          if [ -n "$(git status --porcelain -- index.html og.png build/ultimo_hash.txt build/ultima.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html og.png build/ultimo_hash.txt build/ultima.txt
            git commit -m "Atualiza o site até a rodada $(cat build/ultima.txt)"
            git push
          else
            echo "Nada mudou."
          fi
